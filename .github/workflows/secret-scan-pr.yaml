name: Secret scan PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

concurrency:
  # Include the event name so a new comment doesn't cancel a running commit scan
  group: secret-scan-pr-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  commits:
    name: Scan PR commits for secrets
    # Commits only change on pull_request events
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, dcteam]
    container:
      image: ghcr.io/betterleaks/betterleaks:v2.0.0-rc.1
      env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Run betterleaks on PR commits
        run: |
          # Workspace is owned by the runner user, not the container's root.
          # betterleaks ignores global git config (GIT_CONFIG_GLOBAL=/dev/null),
          # so pass safe.directory as command-scope config via the environment.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          echo "Scanning commits ${BASE_SHA}..${HEAD_SHA}"
          betterleaks git . --platform github --log-opts="${BASE_SHA}..${HEAD_SHA}" --include commit-messages --redact

  comments:
    name: Scan PR comments for secrets
    # issue_comment also fires for plain issues; only scan pull requests
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: [self-hosted, dcteam]
    container:
      image: ghcr.io/betterleaks/betterleaks:v2.0.0-rc.1
      env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PR_URL: "${{ github.event.pull_request.html_url || github.event.issue.html_url }}"
    steps:
      - name: Run betterleaks on PR comments
        run: |
          echo "Scanning comments of ${PR_URL}"
          # --exclude prs skips the PR description; only pr-comments are scanned
          betterleaks github "${PR_URL}" --exclude prs --redact
